name: Build & Package WordPress Plugin

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional tag name or release version label'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-package:
    name: Build & Validate WordPress Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, json, zip, curl
          tools: php-cs-fixer, phpunit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint PHP Syntax
        run: npm run lint:php

      - name: Run Protected WordPress Build
        run: npm run build:wordpress

      - name: Package WordPress Plugin
        run: npm run package:wordpress

      - name: Validate Plugin ZIP Structure
        run: npm run validate:package

      - name: Identify Generated ZIP Artifact
        id: get_artifact
        run: |
          ZIP_FILE=$(find dist -maxdepth 1 -name "nds-hr-v*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No versioned ZIP found in dist/"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP_FILE")
          echo "zip_file=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "Found production plugin package: $ZIP_FILE ($ZIP_NAME)"

      - name: Upload Plugin ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.get_artifact.outputs.zip_name }}
          path: ${{ steps.get_artifact.outputs.zip_file }}
          if-no-files-found: error
          retention-days: 30
